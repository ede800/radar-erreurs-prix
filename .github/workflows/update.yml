name: Mise à jour des erreurs de prix

# Secours du daemon temps réel (python -m scraper.daemon) : GitHub ne garantit pas
# l'horaire des crons, les vraies erreurs de prix se jouent en quelques minutes.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", "tests/**", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      # Mémoire SQLite (déduplication des alertes, plus bas historiques) conservée entre exécutions.
      - name: Restauration de data/history.db
        uses: actions/cache/restore@v4
        with:
          path: data/history.db
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Récupération et analyse des annonces
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python -m scraper.fetch

      - name: Sauvegarde de data/history.db
        if: always() && hashFiles('data/history.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/history.db
          key: history-${{ github.run_id }}

      - name: Commit des nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/deals.json
          if git diff --cached --quiet; then
            echo "Pas de nouvelles annonces."
          else
            git commit -m "Mise à jour des erreurs de prix"
            git pull --rebase --autostash
            git push
          fi
