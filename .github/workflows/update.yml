name: Mise à jour des erreurs de prix

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", "tests/**"]

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Récupération des annonces
        run: python scraper/fetch.py

      - name: Commit des nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/deals.json
          if git diff --cached --quiet; then
            echo "Pas de nouvelles annonces."
          else
            git commit -m "Mise à jour des erreurs de prix"
            git push
          fi
